name: tap

# A release is only real once `brew upgrade` can see it. Doing that by hand meant
# three steps across two repos — download the tarball, checksum it, edit the formula —
# and every one of them was a place for the tag and the sha to drift apart without
# anyone noticing until an install produced the wrong binary under the right name.
#
# TAP_TOKEN can push to guedesdiogo/homebrew-tap, so it is a secret of the `tap`
# environment, not of the repository: a repository secret is readable by a workflow on
# any branch. The environment only admits v* tags, and the "release tags" ruleset leaves
# creating one to admins, so only the workflow and the code of a release tag hold the
# token. Renaming the environment means moving the secret with it.
on:
  release:
    types: [published]
  # For re-running a release whose bump failed: "Use workflow from" its tag. Not for an
  # older tag: the formula would move back to it.
  workflow_dispatch:

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  bump:
    # Two releases published minutes apart would otherwise race for the same push to
    # the tap, and the loser fails on a non-fast-forward. `queue: max` matters as much
    # as the group: the default, `single`, keeps one run waiting and cancels the rest —
    # and a cancelled bump looks like a release that simply never reached Homebrew.
    concurrency:
      group: homebrew-tap-pleach
      cancel-in-progress: false
      queue: max
    environment: tap
    runs-on: ubuntu-latest
    steps:
      - name: resolve the tag
        id: tag
        run: |
          set -euo pipefail
          # The run's own ref is the only source: a release runs on its tag, and a dispatch
          # on the ref it was started from. The environment already refuses anything but a
          # v* tag; this also refuses a v* tag that is not a release version.
          tag="$GITHUB_REF_NAME"
          if [ "$GITHUB_REF_TYPE" != tag ] || ! [[ $tag =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::$GITHUB_REF is not a release tag (refs/tags/vX.Y.Z)"
            exit 1
          fi
          echo "tag=$tag"         >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "resolved to $tag"

      - name: the tag must carry the version it claims
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          set -euo pipefail
          # Homebrew reads the version out of the url, so a tag whose pleach still says
          # 2.1.0 would install as 2.2.0 and answer 2.1.0. That mismatch is invisible to
          # the formula and to brew; it surfaces only at `pleach version`, in someone
          # else's terminal. Refuse the bump instead of shipping it.
          shipped=$(gh api "repos/$GITHUB_REPOSITORY/contents/pleach?ref=$TAG" --jq .content \
                    | base64 -d | sed -n 's/^PLEACH_VERSION="\(.*\)"$/\1/p' | head -1)
          if [ "$shipped" != "$VERSION" ]; then
            echo "::error::$TAG ships PLEACH_VERSION=\"$shipped\", but the tag claims \"$VERSION\""
            exit 1
          fi
          echo "$TAG ships $shipped"

      - name: checksum the release tarball
        id: sha
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          # Downloaded, never assumed: the sha written into the formula has to be the sha
          # of the bytes brew will actually fetch, so this is the same URL the formula names.
          url="https://github.com/$GITHUB_REPOSITORY/archive/refs/tags/$TAG.tar.gz"
          curl -fsSL --retry 3 --retry-delay 2 -o tarball.tar.gz "$url"
          sha=$(sha256sum tarball.tar.gz | cut -d' ' -f1)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "$sha  $url"

      - name: check out the tap
        # Pinned by digest rather than by tag: this is the one step that holds a token
        # with write access to another repository, so a moved `v7` tag would be a write
        # credential handed to code nobody here reviewed. (Verified against the API:
        # this digest is what refs/tags/v7 points at, and its action.yml declares
        # `using: node24` — v4 declared node20, which the runners are retiring.) The token
        # is only lent for the fetch: it is not left in tap/.git/config, where every later
        # step could read it, and the push below gets it on its own.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: guedesdiogo/homebrew-tap
          token: ${{ secrets.TAP_TOKEN }}
          path: tap
          persist-credentials: false

      - name: rewrite the formula
        id: rewrite
        env:
          URL: ${{ steps.sha.outputs.url }}
          SHA: ${{ steps.sha.outputs.sha }}
        run: |
          set -euo pipefail
          f=tap/Formula/pleach.rb
          # Assert both anchors before touching anything. A sed that matches nothing exits
          # 0 and leaves the file untouched, which reads exactly like a release that needed
          # no bump — a silent no-op is the one failure mode this job must not have.
          grep -qE '^  url "https://github\.com/.+/archive/refs/tags/v.+\.tar\.gz"$' "$f" \
            || { echo "::error::no url line to rewrite in $f"; exit 1; }
          grep -qE '^  sha256 "[0-9a-f]{64}"$' "$f" \
            || { echo "::error::no sha256 line to rewrite in $f"; exit 1; }
          sed -i -e "s|^  url \".*\"$|  url \"$URL\"|" \
                 -e "s|^  sha256 \".*\"$|  sha256 \"$SHA\"|" "$f"
          if git -C tap diff --quiet; then
            echo "changed=no" >> "$GITHUB_OUTPUT"
            echo "formula already at this url and sha — nothing to send"
          else
            echo "changed=yes" >> "$GITHUB_OUTPUT"
            git -C tap --no-pager diff
          fi

      - name: send the bump to the tap
        if: steps.rewrite.outputs.changed == 'yes'
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          set -euo pipefail
          cd tap
          # Attributed to the bot that did it, rather than to a person who did not.
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "pleach $VERSION"
          # The checkout kept no credential, so the token reaches git only through the
          # environment of the push itself, the way checkout would have sent it.
          auth=$(printf 'x-access-token:%s' "$TAP_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          GIT_CONFIG_COUNT=1 \
          GIT_CONFIG_KEY_0=http.https://github.com/.extraheader \
          GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth" \
            git push origin HEAD
