name: github-packages

# npm carries pleach as @diogoaguedes/pleach. GitHub Packages carries the same tarball as
# @guedesdiogo/pleach: its npm registry only takes a package scoped to the repository's
# owner, so the name is the one thing that differs. Published on release, like the tap,
# so every version on GitHub Packages is one that was tagged.
#
# Unlike npm.yml and tap.yml, this job runs in no environment, because there is nothing
# to fence off in one: its only credential is the run's own GITHUB_TOKEN, which a workflow
# on any branch can give `packages: write`, and anyone with write access can publish with
# a token of their own anyway. What keeps a branch from publishing by mistake is the tag
# check below.
on:
  release:
    types: [published]
  # For re-running a release whose publish failed: "Use workflow from" its tag. Not for an
  # older tag: npm moves `latest` to whatever it publishes.
  workflow_dispatch:

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  publish:
    # The registry moves `latest` to whatever it publishes last, so two releases minutes
    # apart must publish in order. `queue: max` for the reason tap.yml gives: the default
    # cancels the waiting runs, and a cancelled publish is a release that never went out.
    concurrency:
      group: github-packages-pleach
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      PACKAGE: "@guedesdiogo/pleach"
      REGISTRY: https://npm.pkg.github.com
    steps:
      - name: resolve the tag
        id: tag
        run: |
          set -euo pipefail
          # The run's own ref is the only source: a release runs on its tag, and a dispatch
          # on the ref it was started from, so a dispatch from a branch stops here.
          tag="$GITHUB_REF_NAME"
          if [ "$GITHUB_REF_TYPE" != tag ] || ! [[ $tag =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::$GITHUB_REF is not a release tag (refs/tags/vX.Y.Z)"
            exit 1
          fi
          echo "tag=$tag"         >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "resolved to $tag"

      - name: check out the tag
        # Pinned by digest for the reason tap.yml gives: this job can publish the package,
        # so a moved `v7` tag would hand that right to code nobody here reviewed. Nor is the
        # token left in .git/config, where every later step could read it.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: the tag must carry the version it claims
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          set -euo pipefail
          # npm publishes package.json's version and `pleach version` answers PLEACH_VERSION.
          # A tag where either lags would put one number on the package and another in the
          # terminal that installed it. Refuse instead of publishing it.
          script=$(sed -n 's/^PLEACH_VERSION="\(.*\)"$/\1/p' pleach | head -1)
          pkg=$(node -p 'require("./package.json").version')
          if [ "$script" != "$VERSION" ] || [ "$pkg" != "$VERSION" ]; then
            echo "::error::$TAG claims $VERSION, but pleach says \"$script\" and package.json says \"$pkg\""
            exit 1
          fi
          echo "$TAG ships $VERSION"

      - name: publish
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          set -euo pipefail
          # npm expands ${NODE_AUTH_TOKEN} itself when it reads the file, so the token
          # stays in the environment and is never written to disk.
          npmrc="$RUNNER_TEMP/.npmrc"
          # shellcheck disable=SC2016
          printf '//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}\n' > "$npmrc"
          # The registry refuses a version twice, so a re-run of a release that already
          # went through has nothing to do. Only the printed version counts: for a missing
          # version npm 10 fails with E404, while older npm printed nothing and exited 0.
          published=$(npm view "$PACKAGE@$VERSION" version --registry "$REGISTRY" --userconfig "$npmrc" 2>/dev/null || true)
          if [ "$published" = "$VERSION" ]; then
            echo "$PACKAGE@$VERSION is already on GitHub Packages - nothing to publish"
            exit 0
          fi
          npm pkg set name="$PACKAGE"
          # No lifecycle script runs with the token in its environment.
          npm publish --ignore-scripts --registry "$REGISTRY" --userconfig "$npmrc"
