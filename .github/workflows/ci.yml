name: ci
on:
  push:
    branches: [main]
  pull_request:

# windows-latest defaults to pwsh; `bash` there is the Git Bash that ships with
# Git for Windows, which is exactly the environment pleach claims to support.
defaults:
  run:
    shell: bash

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        if: runner.os != 'Windows'
        run: |
          command -v shellcheck >/dev/null || brew install shellcheck
          shellcheck pleach install.sh tests/run.sh tests/no-leaks.sh examples/*.sh
      - name: no internal references
        run: tests/no-leaks.sh
      - name: tests
        run: tests/run.sh
